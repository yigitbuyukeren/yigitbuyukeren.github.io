<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<title>banner-site</title>
<!-- Site deposu README başlığı ve GitHub sosyal önizleme görseli, "Sinyal" tasarımı.
     Parametreler: ?theme=light|dark  &shot=shot-dark.png (1440x900 ana sayfa ekran görüntüsü, _gh/ altında)
     &h=691 (sahne yüksekliği; sahne 1700 px geniş, sosyal önizleme için h=850 ve html zoom ile küçültülür).
     Elle üretmek için tools/og/render-og.sh çalıştır. -->
<link rel="stylesheet" href="/assets/site.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;background:var(--bg)}
.st{position:relative;width:1700px;overflow:hidden;background:var(--bg);color:var(--ink);display:flex}
.st::before{content:"";position:absolute;inset:0 0 0 76px;background:repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 124px)}
.left{position:relative;width:745px;flex:none;padding:62px 76px;display:flex;flex-direction:column;border-right:1px solid var(--rule-strong);background:var(--bg)}
.left::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px calc(100% / 6))}
.left>*{position:relative}
.dom{font:500 22px/1 var(--f-mono);letter-spacing:.04em;color:var(--muted)}
.badge{display:inline-flex;align-items:center;justify-content:center;height:64px;min-width:80px;padding:0 16px;border:1px solid var(--rule-strong);border-radius:9px;background:var(--surface);font:600 32px/1 var(--f-mono);letter-spacing:-.06em;margin-bottom:34px}
.badge i{color:var(--accent);font-style:normal}
.mid{margin:auto 0}
h1{margin:0;font:400 92px/.95 var(--f-display);letter-spacing:-.02em;white-space:nowrap}
h1 em{font-style:italic;color:var(--em-color);background:var(--em-bg)}
p.t{margin:26px 0 0;font:400 35px/1.3 var(--f-body);color:var(--ink-2);letter-spacing:-.01em}
.tags{display:flex;gap:12px;margin-top:34px}
.tags span{padding:11px 18px;border:1px solid var(--rule-strong);border-radius:6px;font:500 20px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.win{position:absolute;left:822px;top:76px;width:1000px;border:1px solid var(--rule-strong);border-radius:12px 12px 0 0;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.bar{height:44px;display:flex;align-items:center;gap:9px;padding:0 18px;border-bottom:1px solid var(--rule-strong);background:var(--bg-2)}
.bar b{width:13px;height:13px;border-radius:50%;background:var(--rule-strong)}
.bar span{margin-left:18px;font:500 16px/1 var(--f-mono);letter-spacing:.04em;color:var(--muted)}
.win img{display:block;width:1000px;height:auto}
</style>
</head>
<body>
<div class="st" id="st">
  <div class="left">
    <div class="dom">yigitbuyukeren.com</div>
    <div class="mid">
      <span class="badge">yb<i>.</i></span>
      <h1>Kişisel <em>sitem</em></h1>
      <p class="t">Framework'süz HTML ve CSS, kendi sunucumda.</p>
      <div class="tags"><span>HTML</span><span>CSS</span><span>Caddy</span><span>TR · EN</span></div>
    </div>
  </div>
  <div class="win"><div class="bar"><b></b><b></b><b></b><span>yigitbuyukeren.com</span></div><img id="shot" alt=""></div>
</div>
<script>
var q=new URLSearchParams(location.search);
document.documentElement.setAttribute('data-theme',q.get('theme')==='light'?'light':'dark');
document.getElementById('st').style.height=(q.get('h')||'691')+'px';
document.getElementById('shot').src=q.get('shot')||'shot-dark.png';
if(q.get('zoom'))document.documentElement.style.zoom=q.get('zoom');
</script>
</body>
</html>
