<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<title>og-home</title>
<!-- Ana sayfa paylaşım görseli (1200x630), "Kil" tasarımı.
     Dil: ?lang=tr (varsayılan) veya ?lang=en. Elle üretmek için tools/og/render-og.sh çalıştır;
     bu dosya sitenin köküyle birlikte sunulan _gh/ altından açılır, /assets/home.css'i kullanır. -->
<link rel="stylesheet" href="/assets/home.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#F2EBE0}
.og{position:relative;width:1200px;height:630px;padding:64px 80px;background:#F2EBE0;color:#17120E;display:flex;flex-direction:column;font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.top{display:flex;align-items:flex-start;justify-content:space-between}
.id{display:flex;align-items:center;gap:18px;font-weight:500;font-size:27px;line-height:1.1}
.badge{display:inline-flex;align-items:center;justify-content:center;height:52px;min-width:66px;padding:0 14px;border:1px solid #D5C7B5;border-radius:12px;background:#FFFFFF;font-weight:600;font-size:24px;letter-spacing:-.05em}
.badge i{color:#B0402A;font-style:normal}
.av{width:128px;height:128px;border-radius:50%;overflow:hidden;background:#EFE9E1;border:1px solid #D5C7B5}
.av img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
h1{margin:auto 0 0;font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:94px;line-height:.92;letter-spacing:-.04em;max-width:16ch}
h1 em{color:#B0402A;font-style:normal}
.bot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:44px;padding-top:26px;border-top:1px solid #D5C7B5}
.tag{font-weight:500;font-size:23px;line-height:1.2;letter-spacing:.005em;color:#5E5245;display:flex;align-items:center;gap:14px}
.tag::before{content:"";width:11px;height:11px;border-radius:50%;background:#B0402A}
.dom{font-weight:500;font-size:21px;line-height:1;letter-spacing:.01em;color:#5E5245}
</style>
</head>
<body>
<div class="og">
  <div class="top">
    <div class="id"><span class="badge">yb<i>.</i></span><span>Yiğit Eren Büyükeren</span></div>
    <div class="av"><img src="/assets/img/avatar.png" alt=""></div>
  </div>
  <h1 id="h"></h1>
  <div class="bot"><div class="tag" id="tag"></div><div class="dom">yigitbuyukeren.com</div></div>
</div>
<script>
var en=/lang=en/.test(location.search);
document.documentElement.lang=en?'en':'tr';
document.getElementById('h').innerHTML=en
 ?'From idea<br>to <em>release</em>,<br>end to end.'
 :'Fikirden<br><em>yayına</em>,<br>tek elden.';
document.getElementById('tag').textContent=en
 ?'Android · Mobile · Backend · Istanbul'
 :'Android · Mobil · Backend · İstanbul';
</script>
</body>
</html>
